a.b:hover,a.b:focus-visible{border-color:var(--gh);box-shadow:0 0 22px rgba(230,193,90,.25);transform:translateY(-1px)}
a.b:hover:before,a.b:focus-visible:before{left:120%}
a.b svg{width:21px;height:21px;flex:none;fill:var(--g)}
a.b span{flex:1;text-align:left}a.b i{font-style:normal;color:var(--g);font-size:16px}
a.f{border-color:var(--g);padding:20px 18px;box-shadow:0 0 26px rgba(230,193,90,.22),inset 0 0 18px rgba(230,193,90,.06);animation:pulse 4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 38px rgba(230,193,90,.36),inset 0 0 18px rgba(230,193,90,.1)}}
a.f img{width:34px;height:34px;flex:none}

<script>
(()=>{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
const c=document.getElementById('fx'),x=c.getContext('2d');let W,H,d=Math.min(devicePixelRatio||1,2),P=[];
function rs(){W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}
rs();addEventListener('resize',rs);
const n=innerWidth<600?26:44;
for(let i=0;i<n;i++){const big=Math.random()<.22;P.push({x:Math.random()*W,y:Math.random()*H,r:big?18+Math.random()*40:1+Math.random()*3.2,a:big?.05+Math.random()*.07:.25+Math.random()*.5,vx:(Math.random()-.5)*.15,vy:-(.05+Math.random()*.25),t:Math.random()*6.28})}
function f(){x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';
for(const p of P){p.x+=p.vx+Math.sin(p.t+=.006)*.12;p.y+=p.vy;if(p.y<-p.r*2){p.y=H+p.r*2;p.x=Math.random()*W}if(p.x<-80)p.x=W+80;if(p.x>W+80)p.x=-80;
const g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*(p.r<5?3:1));const al=p.a*(.75+.25*Math.sin(p.t*3));
g.addColorStop(0,`rgba(245,215,122,${al})`);g.addColorStop(.4,`rgba(230,193,90,${al*.5})`);g.addColorStop(1,'rgba(230,193,90,0)');
x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,p.r*(p.r<5?3:1),0,6.283);x.fill()}
requestAnimationFrame(f)}f()})();
